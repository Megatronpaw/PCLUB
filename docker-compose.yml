services:
  postgres:
    image: postgres:17-alpine
    container_name: pclub-postgres
    environment:
      POSTGRES_DB: pclub
      POSTGRES_USER: pclub
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pclub -d pclub"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
